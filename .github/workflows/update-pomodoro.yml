name: Update Pomodoro cask

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pomodoro-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Update from the latest stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_pomodoro.py
          if [[ -f Casks/pomodoro-blocker.rb ]]; then
            ruby -c Casks/pomodoro-blocker.rb
          fi
      - name: Publish cask changes
        env:
          TAP_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -f Casks/pomodoro-blocker.rb ]]; then
            git add Casks/pomodoro-blocker.rb
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Pomodoro Blocker cask'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TAP_BRANCH"
            if git push origin "HEAD:$TAP_BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
